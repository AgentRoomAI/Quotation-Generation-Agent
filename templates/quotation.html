<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quotation Generated</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-3">Quotation Generated Successfully</h2>
        <p><strong>Quotation ID:</strong> {{ quotation_id }}</p>
        <p><strong>PDF:</strong> {{ pdf_name }}</p>
        <p class="text-muted">The quotation is ready for download and forwarding to finance or procurement.</p>
        {% if download_url %}
        <a class="btn btn-primary" href="{{ download_url }}">Download PDF</a>
        {% endif %}
        <a class="btn btn-primary" href="{{ url_for('index') }}">Back to Home</a>
    </div>
</div>
</body>
</html>
